appId: com.chouyu.app
productName: ChouYu
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!out/types-*"

extraResources:
  - from: resources/journal-capture.html
    to: journal-capture.html
  - from: resources/journal-ocr.ps1
    to: journal-ocr.ps1
  - from: resources/journal-activity.ps1
    to: journal-activity.ps1
  - from: resources/offline-ocr.ps1
    to: offline-ocr.ps1
  - from: resources/icon.png
    to: icon.png

publish:
  provider: github
  owner: cone387
  repo: ChouYu

mac:
  category: public.app-category.utilities
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

dmg:
  sign: false

win:
  icon: resources/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
