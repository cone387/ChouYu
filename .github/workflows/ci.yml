name: Quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:memory-eval
      - run: npm run build
      - run: npm run test:smoke:built
        env:
          # Native foreground/WGC acceptance runs separately on an interactive Windows desktop.
          CHOUYU_SMOKE_SYNTHETIC_CAPTURE: '1'
