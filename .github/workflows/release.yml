name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:dsh-runtime
      - run: npx install-electron --no
      - run: npm audit --audit-level=high
      - run: npm audit --prefix runtime/dsh --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:memory-eval
      - run: npm run test:smoke

  prepare-release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create shared release draft before parallel uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Release assets are being built."

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --mac --publish always

      - name: Verify packaged SQLite checkpoint persistence
        run: node scripts/verify-sqlite-runtime.cjs dist/mac-universal/ChouYu.app/Contents/MacOS/ChouYu dist/mac-universal/ChouYu.app/Contents/Resources/app.asar

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npm run build:dsh-runtime && npx electron-builder --win --publish always

      - name: Verify packaged SQLite checkpoint persistence
        run: node scripts/verify-sqlite-runtime.cjs dist/win-unpacked/ChouYu.exe dist/win-unpacked/resources/app.asar

      - name: Verify packaged application and legacy migration
        run: npm run test:smoke:packaged

      - name: Verify packaged DSH runtime
        run: node scripts/smoke-electron.js --packaged dist/win-unpacked/ChouYu.exe --dsh-harness

      - name: Verify v1.3.4 data upgrade
        run: node scripts/smoke-electron.js --packaged dist/win-unpacked/ChouYu.exe --navigation --upgrade-v134

      - name: Verify packaged contact recovery
        run: node scripts/smoke-electron.js --packaged dist/win-unpacked/ChouYu.exe --contact-reliability

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          grep -E '\.dmg$' /tmp/release-assets.txt
          grep -E '\.zip$' /tmp/release-assets.txt
          grep -E '\.exe$' /tmp/release-assets.txt
          grep -Fx 'latest-mac.yml' /tmp/release-assets.txt
          grep -Fx 'latest.yml' /tmp/release-assets.txt
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest --title "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest --title "$RELEASE_TAG"
          fi
