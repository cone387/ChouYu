name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:memory-eval
      - run: npm run test:smoke

  build-macos:
    needs: quality
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --mac --publish always

  build-windows:
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --publish always

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest --title "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest --title "$RELEASE_TAG"
          fi
